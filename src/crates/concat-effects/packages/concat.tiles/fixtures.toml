# A flat picture in, the middle pixel out: on an 8 by 8 picture that pixel
# is a little right of and below the middle, so with two across it is in
# the second tile, with three in the middle one.

[[probe]]
name = "default, a flat colour holds"
input = [0.8, 0.5, 0.3, 1]
expect = [0.8, 0.5, 0.3, 1]

[[probe]]
name = "a grid of the whole picture holds a highlight and its alpha"
params = { across = 4, down = 4 }
input = [4, 1, 0.05, 0.5]
expect = [4, 1, 0.05, 0.5]

[[probe]]
name = "none shown is black"
params = { shown = 0 }
input = [0.8, 0.5, 0.3, 1]
expect = [0, 0, 0, 1]

[[probe]]
name = "none shown and clear is see-through"
params = { shown = 0, empty = 1 }
input = [0.8, 0.5, 0.3, 1]
expect = [0, 0, 0, 0]

# Half of two tiles is the first: the left one in reading order, so the
# middle pixel's, the right one, is still to come; read from the right it
# is the first.
[[probe]]
name = "half shown, left to right, the right tile waits"
params = { across = 2, shown = 50 }
input = [0.8, 0.5, 0.3, 1]
expect = [0, 0, 0, 1]

[[probe]]
name = "half shown, right to left, the right tile is there"
params = { across = 2, shown = 50, order = 1 }
input = [0.8, 0.5, 0.3, 1]
expect = [0.8, 0.5, 0.3, 1]

# Building on the beat, the clip's first instant has its first tile only.
[[probe]]
name = "building, at the start only the first tile"
params = { across = 2, build = 3 }
input = [0.8, 0.5, 0.3, 1]
expect = [0, 0, 0, 1]

[[probe]]
name = "building from the middle, the middle tile comes first"
params = { across = 3, build = 1, order = 2 }
input = [0.8, 0.5, 0.3, 1]
expect = [0.8, 0.5, 0.3, 1]

# Centred a quarter of the picture away, the middle tile shows another
# part of a flat picture: the same colour.
[[probe]]
name = "off centre, a flat colour holds"
params = { shift_x = -25, shift_y = 25 }
input = [0.8, 0.5, 0.3, 1]
expect = [0.8, 0.5, 0.3, 1]

# Zoomed out to a quarter, the picture still covers the middle.
[[probe]]
name = "zoomed out, the middle still shows"
params = { across = 1, zoom = 25 }
input = [0.05, 0.15, 0.4, 1]
expect = [0.05, 0.15, 0.4, 1]

[[probe]]
name = "at its least nothing is shown"
at = "min"
input = [0.8, 0.5, 0.3, 1]
expect = [0, 0, 0, 1]

# At its most it builds a quarter beat at a time, at random, into twelve
# by eight: at the clip's first instant one tile is there, not the middle
# pixel's (it comes 69th), and the rest is clear.
[[probe]]
name = "at its most only the first random tile is there yet"
at = "max"
input = [0.8, 0.5, 0.3, 1]
expect = [0, 0, 0, 0]
