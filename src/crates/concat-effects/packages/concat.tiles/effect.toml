format = 2

[effect]
id = "concat.tiles"
name = "Tiles"
kind = "effect"
category = "Distort"
order = 53
intensity = "across"
description = "The picture repeated side by side like a wall of screens, all at once or a tile at a time on the beat from the clip's start. With Freeze, each tile stops where it was as the next one comes, as a video mixer's strobe did."

[[param]]
key = "across"
label = "Across"
type = "int"
min = 1
max = 12
default = 3
step = 1

[[param]]
key = "down"
label = "Down"
type = "int"
min = 1
max = 8
default = 1
step = 1

[[param]]
key = "zoom"
label = "Zoom"
unit = "%"
min = 25
max = 400
step = 1
default = 100

[[param]]
key = "shift_x"
label = "Center X"
unit = "%"
min = -50
max = 50
step = 1
default = 0

[[param]]
key = "shift_y"
label = "Center Y"
unit = "%"
min = -50
max = 50
step = 1
default = 0

[[param]]
key = "shown"
label = "Shown"
unit = "%"
min = 0
max = 100
step = 1
default = 100

[[param]]
key = "build"
label = "Build"
type = "enum"
min = 0
max = 3
default = 0
values = [0, 1, 2, 3]
labels = ["All at once", "Every beat", "Every half beat", "Every quarter beat"]

[[param]]
key = "bpm"
label = "Tempo"
unit = "BPM"
min = 40
max = 240
step = 1
default = 120

[[param]]
key = "freeze"
label = "Freeze"
type = "bool"
min = 0
max = 1
default = 0
step = 1

[[param]]
key = "order"
label = "Order"
type = "enum"
min = 0
max = 3
default = 0
values = [0, 1, 2, 3]
labels = ["Left to right", "Right to left", "From the middle", "Random"]

[[param]]
key = "gap"
label = "Gap"
unit = "%"
min = 0
max = 20
step = 1
default = 0

[[param]]
key = "empty"
label = "Empty"
type = "enum"
min = 0
max = 1
default = 0
values = [0, 1]
labels = ["Black", "Clear"]

[wgsl]
entry = "effect.wgsl"
